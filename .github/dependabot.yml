version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      lint-and-format:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "oxfmt", "globals"]
      fonts:
        patterns: ["@fontsource*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
