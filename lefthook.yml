# Git hooks managed by lefthook (installed automatically by `pnpm install`).
# Skip once with: LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,mjs,cjs,ts,mts,json,jsonc,md,mdx,css,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,mjs,cjs,ts,mts,astro}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: astro check
      run: pnpm check
